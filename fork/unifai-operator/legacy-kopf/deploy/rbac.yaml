apiVersion: v1
kind: ServiceAccount
metadata:
  name: unifai-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unifai-operator
rules:
  - apiGroups: [unifai.startx.fr]
    resources: ["*"]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unifai-operator
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: unifai-operator}
subjects:
  - kind: ServiceAccount
    name: unifai-operator
---
# kopf discovers the served CRDs and namespaces (read-only, cluster scope)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unifai-operator-discovery
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unifai-operator-discovery-unifai-devel
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: unifai-operator-discovery}
subjects:
  - kind: ServiceAccount
    name: unifai-operator
    namespace: unifai-devel
