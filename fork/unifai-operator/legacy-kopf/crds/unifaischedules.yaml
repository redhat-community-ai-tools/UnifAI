apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: unifaischedules.unifai.startx.fr
spec:
  group: unifai.startx.fr
  scope: Namespaced
  names:
    kind: UnifaiSchedule
    plural: unifaischedules
    singular: unifaischedule
    shortNames:
    - usch
    categories:
    - unifai
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Workflow
      type: string
      jsonPath: .spec.workflow
    - name: ScheduleId
      type: string
      jsonPath: .status.scheduleId
    - name: Message
      type: string
      jsonPath: .status.message
      priority: 1
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - workflow
            - inputs
            - schedule
            properties:
              owner:
                type: string
                default: admin
                description: UnifAI user owning the object (workspace identity)
              teamId:
                type: string
                description: Use a team workspace instead of the user's
              unifaiName:
                type: string
                description: Name in UnifAI (defaults to metadata.name)
              workflow:
                type: string
                description: UnifAI workflow (blueprint) name
              inputs:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                description: Workflow inputs, e.g. user_prompt
              suspend:
                type: boolean
              schedule:
                type: object
                description: interval (ISO-8601) XOR cron_expression
                properties:
                  interval: &id001
                    type: string
                  cron_expression: *id001
                  timezone: *id001
                  overlap_policy:
                    type: string
                    enum:
                    - skip
                    - buffer_one
                    - cancel_other
                  start_at: *id001
                  end_at: *id001
                  remaining_actions:
                    type: integer
                  enabled:
                    type: boolean
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
