apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: unifaichats.unifai.startx.fr
spec:
  group: unifai.startx.fr
  scope: Namespaced
  names:
    kind: UnifaiChat
    plural: unifaichats
    singular: unifaichat
    shortNames:
    - uchat
    categories:
    - unifai
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Workflow
      type: string
      jsonPath: .spec.workflow
    - name: Session
      type: string
      jsonPath: .status.sessionId
    - name: Message
      type: string
      jsonPath: .status.message
      priority: 1
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - workflow
            - prompt
            properties:
              owner:
                type: string
                default: admin
                description: UnifAI user owning the object (workspace identity)
              teamId:
                type: string
                description: Use a team workspace instead of the user's
              unifaiName:
                type: string
                description: Name in UnifAI (defaults to metadata.name)
              workflow: &id001
                type: string
              prompt: *id001
              title: *id001
              hitl:
                type: boolean
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
