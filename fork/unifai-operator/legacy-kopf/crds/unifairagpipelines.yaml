apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: unifairagpipelines.unifai.startx.fr
spec:
  group: unifai.startx.fr
  scope: Namespaced
  names:
    kind: UnifaiRAGPipeline
    plural: unifairagpipelines
    singular: unifairagpipeline
    shortNames:
    - urag
    categories:
    - unifai
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Message
      type: string
      jsonPath: .status.message
      priority: 1
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - documents
            properties:
              owner:
                type: string
                default: admin
                description: UnifAI user owning the object (workspace identity)
              teamId:
                type: string
                description: Use a team workspace instead of the user's
              unifaiName:
                type: string
                description: Name in UnifAI (defaults to metadata.name)
              skipValidation:
                type: boolean
              documents:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - source
                  properties:
                    name:
                      type: string
                      description: File name with extension (pdf, docx, md, pptx)
                    tags:
                      type: array
                      items: &id001
                        type: string
                    metadata:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    source:
                      type: object
                      properties:
                        inline: *id001
                        url: *id001
                        configMapKeyRef:
                          type: object
                          required:
                          - name
                          - key
                          properties:
                            name: *id001
                            key: *id001
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
