apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiAgent",
          "metadata": {
            "name": "demo-agent"
          },
          "spec": {
            "config": {
              "hitl_mode": "skip",
              "llm": "$ref:llm/demo-fake",
              "max_rounds": 10,
              "providers": [
                "$ref:provider/demo-mcp"
              ],
              "strategy_type": "react",
              "system_message": "You are a concise assistant.",
              "tools": [
                "$ref:tool/demo-web-fetch"
              ]
            },
            "type": "custom_agent_node"
          }
        },
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiChat",
          "metadata": {
            "name": "demo-chat-smoke"
          },
          "spec": {
            "prompt": "ping",
            "title": "Smoke test",
            "workflow": "demo-linear"
          }
        },
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiCondition",
          "metadata": {
            "name": "demo-direct"
          },
          "spec": {
            "config": {},
            "type": "router_direct"
          }
        },
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiLLM",
          "metadata": {
            "name": "demo-fake"
          },
          "spec": {
            "config": {
              "api_key": "EMPTY",
              "base_url": "http://unifai-demo-llm:8000/v1",
              "model_name": "mock-model"
            },
            "type": "openai_compatible"
          }
        },
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiProvider",
          "metadata": {
            "name": "demo-mcp"
          },
          "spec": {
            "config": {
              "auth_method": "access_token",
              "mcp_url": "http://unifai-demo-mcp:8004/sse",
              "tool_names": [
                "utc_now",
                "echo"
              ],
              "transport_type": "sse"
            },
            "type": "mcp_server"
          }
        },
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiRAGPipeline",
          "metadata": {
            "name": "demo-docs"
          },
          "spec": {
            "documents": [
              {
                "name": "unifai-demo-notes.md",
                "source": {
                  "inline": "# UnifAI demo notes\nThe startx demo cluster hosts UnifAI in the namespace unifai-devel.\nObjects are declared with the unifai.startx.fr custom resources.\n"
                },
                "tags": [
                  "demo",
                  "notes"
                ]
              },
              {
                "name": "operator-readme.md",
                "source": {
                  "configMapKeyRef": {
                    "key": "operator-readme.md",
                    "name": "unifai-demo-docs"
                  }
                },
                "tags": [
                  "demo"
                ]
              }
            ],
            "owner": "admin"
          }
        },
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiRetriever",
          "metadata": {
            "name": "demo-docs"
          },
          "spec": {
            "config": {
              "threshold": 0.3,
              "timeout": 30,
              "top_k_results": 5
            },
            "type": "docs_rag"
          }
        },
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiSandbox",
          "metadata": {
            "name": "demo-openshell"
          },
          "spec": {
            "config": {
              "gateway_url": "https://openshell-gateway.example.com:8443",
              "keep_sandbox": false,
              "workdir": "/sandbox"
            },
            "secretRefs": [
              {
                "path": "ca_cert",
                "secretKeyRef": {
                  "key": "ca.pem",
                  "name": "openshell-pki"
                }
              },
              {
                "path": "tls_cert",
                "secretKeyRef": {
                  "key": "tls.crt",
                  "name": "openshell-pki"
                }
              },
              {
                "path": "tls_key",
                "secretKeyRef": {
                  "key": "tls.key",
                  "name": "openshell-pki"
                }
              }
            ],
            "type": "openshell_sandbox"
          }
        },
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiSchedule",
          "metadata": {
            "name": "demo-every-30m"
          },
          "spec": {
            "inputs": {
              "user_prompt": "status report, please"
            },
            "schedule": {
              "interval": "PT30M",
              "overlap_policy": "skip",
              "timezone": "UTC"
            },
            "workflow": "demo-linear"
          }
        },
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiStack",
          "metadata": {
            "name": "unifai"
          },
          "spec": {
            "identity": {
              "adminUsers": [
                "admin"
              ],
              "keycloak": {
                "database": {
                  "type": "auto"
                }
              }
            },
            "profile": "dev",
            "rag": {
              "docling": {
                "mode": "local"
              },
              "embedding": {
                "mode": "local"
              }
            },
            "storage": {
              "className": "gp3-csi",
              "sharedClassName": "nfs"
            }
          }
        },
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiTemplate",
          "metadata": {
            "name": "demo-chat-quickstart"
          },
          "spec": {
            "draft": {
              "description": "One Gemini agent answering questions.",
              "llms": [
                {
                  "config": {
                    "api_key": "PLACEHOLDER_API_KEY",
                    "model_name": "gemini-3.5-flash",
                    "type": "google_genai"
                  },
                  "name": "gemini",
                  "rid": "llm_rid",
                  "type": "google_genai"
                }
              ],
              "name": "Demo Chat Quickstart",
              "nodes": [
                {
                  "config": {
                    "retries": 1,
                    "type": "user_question_node"
                  },
                  "name": "User Question Node",
                  "rid": "user_question",
                  "type": "user_question_node"
                },
                {
                  "config": {
                    "retries": 1,
                    "type": "final_answer_node"
                  },
                  "name": "Final Answer Node",
                  "rid": "final_answer",
                  "type": "final_answer_node"
                },
                {
                  "config": {
                    "hitl_mode": "skip",
                    "llm": "llm_rid",
                    "system_message": "You are a helpful assistant.",
                    "type": "custom_agent_node"
                  },
                  "name": "Assistant",
                  "rid": "agent_rid",
                  "type": "custom_agent_node"
                }
              ],
              "plan": [
                {
                  "node": "user_question",
                  "uid": "ask"
                },
                {
                  "after": "ask",
                  "node": "agent_rid",
                  "uid": "answer"
                },
                {
                  "after": "answer",
                  "node": "final_answer",
                  "uid": "finish"
                }
              ]
            },
            "metadata": {
              "author": "startx",
              "category": "Chat",
              "is_public": true,
              "tags": [
                "chat",
                "quickstart"
              ],
              "version": "1.0.0"
            },
            "owner": "admin",
            "placeholders": {
              "categories": [
                {
                  "category": "llms",
                  "resources": [
                    {
                      "placeholders": [
                        {
                          "field_path": "api_key",
                          "hint": "Google AI Studio key",
                          "label": "Gemini API key",
                          "required": true
                        }
                      ],
                      "rid": "llm_rid"
                    }
                  ]
                }
              ]
            }
          }
        },
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiTool",
          "metadata": {
            "name": "demo-web-fetch"
          },
          "spec": {
            "config": {},
            "type": "web_fetch"
          }
        },
        {
          "apiVersion": "unifai.startx.fr/v1alpha1",
          "kind": "UnifaiWorkflow",
          "metadata": {
            "name": "demo-linear"
          },
          "spec": {
            "blueprint": {
              "conditions": [
                {
                  "rid": "$ref:condition/demo-direct"
                }
              ],
              "nodes": [
                {
                  "config": {
                    "retries": 1,
                    "type": "user_question_node"
                  },
                  "name": "User Question Node",
                  "rid": "user_question",
                  "type": "user_question_node"
                },
                {
                  "config": {
                    "retries": 1,
                    "type": "final_answer_node"
                  },
                  "name": "Final Answer Node",
                  "rid": "final_answer",
                  "type": "final_answer_node"
                },
                {
                  "rid": "$ref:agent/demo-agent"
                }
              ],
              "plan": [
                {
                  "branches": {
                    "agent": "agent"
                  },
                  "exit_condition": "$rid:condition/demo-direct",
                  "node": "user_question",
                  "uid": "ask"
                },
                {
                  "node": "$rid:agent/demo-agent",
                  "uid": "agent"
                },
                {
                  "after": "agent",
                  "node": "final_answer",
                  "uid": "finish"
                }
              ]
            },
            "description": "question -\u003e demo-agent -\u003e answer"
          }
        }
      ]
    capabilities: Seamless Upgrades
    categories: AI/Machine Learning, Developer Tools
