    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UnifaiStack deploys a complete UnifAI platform in its namespace
          (at most one per namespace, named `unifai`).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: UnifaiStackSpec defines a complete UnifAI deployment in the
              namespace of the resource.
            properties:
              deletionPolicy:
                default: Retain
                description: Retain keeps PVCs, the generated secret and the Keycloak
                  database when the stack is deleted; Delete removes them.
                enum:
                - Retain
                - Delete
                type: string
              exposure:
                description: ExposureSpec configures how the stack is reached from
                  outside the namespace.
                properties:
                  domain:
                    description: Apps domain used to build hosts. Empty = OpenShift
                      cluster ingress domain.
                    type: string
                  exposeInternal:
                    description: |-
                      Also create the upstream Routes of internal services (mongodb, qdrant, redis-insight, temporal, backend, multiagent-be).
                      They have no authentication: keep false outside of debugging.
                    type: boolean
                  identityHost:
                    description: 'Identity host. Default: unifai-identity-<namespace>.<domain>.'
                    type: string
                  networkPolicy:
                    default: true
                    description: Restrict ingress to the namespace, the OpenShift
                      router and the operator (the internal APIs trust an identity
                      header).
                    type: boolean
                  uiHost:
                    description: 'UI host. Default: unifai-ui-<namespace>.<domain>.'
                    type: string
                type: object
              identity:
                description: IdentitySpec configures authentication (exactly one of
                  external or keycloak).
                properties:
                  adminUsers:
                    default:
                    - admin
                    description: UnifAI administrators (Keycloak usernames).
                    items:
                      type: string
                    type: array
                  external:
                    description: ExternalOIDCSpec points the identity service to an
                      existing Keycloak realm.
                    properties:
                      clientId:
                        default: unifai
                        type: string
                      clientSecret:
                        description: SecretKeySelector selects a key of a Secret in
                          the CR's namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      realm:
                        default: unifai
                        type: string
                      url:
                        description: Keycloak base URL, e.g. https://keycloak.example.com
                        type: string
                    required:
                    - clientSecret
                    - url
                    type: object
                  keycloak:
                    description: ManagedKeycloakSpec deploys Keycloak (Red Hat build
                      of Keycloak operator) and the UnifAI realm in the stack namespace.
                    properties:
                      adminPassword:
                        description: 'Password of the realm users listed in identity.adminUsers.
                          Default: generated (key keycloak-admin-password of the generated
                          secret).'
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      channel:
                        default: stable-v26.6
                        description: RHBK Subscription channel.
                        type: string
                      database:
                        description: KeycloakDatabaseSpec selects the database of
                          a managed Keycloak.
                        properties:
                          image:
                            description: PostgreSQL image of the StatefulSet mode.
                            type: string
                          type:
                            default: auto
                            description: auto = Crunchy PostgresCluster when the Crunchy
                              operator serves this namespace, else a PostgreSQL StatefulSet.
                            enum:
                            - auto
                            - crunchy
                            - statefulset
                            type: string
                        type: object
                      host:
                        description: 'Keycloak host. Default: unifai-keycloak-<namespace>.<domain>.'
                        type: string
                      installOperator:
                        default: true
                        description: Install the RHBK operator in the namespace (OperatorGroup
                          + Subscription) when it does not serve it yet.
                        type: boolean
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of identity.external or identity.keycloak
                  rule: has(self.external) != has(self.keycloak)
              imagePullPolicy:
                description: PullPolicy describes a policy for if/when to pull a container
