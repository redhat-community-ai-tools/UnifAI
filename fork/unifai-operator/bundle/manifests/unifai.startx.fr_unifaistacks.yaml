                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              imageRegistry:
                default: quay.io/zuno
                description: Registry and organization of the UnifAI images.
                type: string
              images:
                additionalProperties:
                  type: string
                description: 'Full image overrides by component: mongodb, qdrant,
                  rabbitmq, redis, redisInsight, temporal, rag, multiagent, backend,
                  identity, ui, docling.'
                type: object
              integrations:
                description: IntegrationsSpec groups optional third-party integrations.
                properties:
                  gcpServiceAccountKey:
                    description: GCP service account key (JSON) for Vertex AI agents
                      (claude_agent_node).
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  langfuse:
                    description: LangfuseSpec configures LLM tracing.
                    properties:
                      baseUrl:
                        default: https://us.cloud.langfuse.com
                        type: string
                      publicKey:
                        description: SecretKeySelector selects a key of a Secret in
