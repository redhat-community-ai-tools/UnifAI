                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      secretKey:
                        description: SecretKeySelector selects a key of a Secret in
                          the CR's namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - publicKey
                    - secretKey
                    type: object
                  slack:
                    description: SlackSpec configures the Slack integration (RAG Slack
                      source and backend socket-mode bot).
                    properties:
                      appToken:
                        description: 'App-level token: enables the backend slack-socket
                          sidecar.'
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      botToken:
                        description: SecretKeySelector selects a key of a Secret in
                          the CR's namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      signingSecret:
                        description: SecretKeySelector selects a key of a Secret in
                          the CR's namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      userToken:
                        description: SecretKeySelector selects a key of a Secret in
                          the CR's namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  umami:
                    description: UmamiSpec configures UI analytics.
                    properties:
                      password:
                        description: SecretKeySelector selects a key of a Secret in
                          the CR's namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      url:
                        type: string
                      username:
                        description: SecretKeySelector selects a key of a Secret in
                          the CR's namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      websiteName:
                        type: string
                    required:
                    - url
                    type: object
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                description: Added to every UnifAI pod.
                type: object
              paused:
                description: Stop reconciling (nothing is changed or deleted).
                type: boolean
              profile:
                default: dev
                description: dev = small resource requests and no autoscaling; prod
                  = upstream requests (~25 CPU / 60 GiB).
                enum:
                - dev
                - prod
                type: string
              rag:
                description: RAGSpec configures the RAG data pipeline.
                properties:
                  docling:
                    description: DoclingSpec configures document conversion.
                    properties:
                      mode:
                        default: local
                        description: local = docling library inside the rag pods;
                          remote = existing service at url; deploy = docling chart
                          in the namespace.
                        enum:
                        - local
                        - remote
                        - deploy
                        type: string
                      url:
                        type: string
                    type: object
                  embedding:
                    description: EmbeddingSpec configures the embedding model.
                    properties:
                      dimension:
                        type: integer
                      mode:
                        default: local
                        description: local = sentence-transformers inside the rag
                          pods; remote = embedding service at url.
                        enum:
                        - local
                        - remote
                        type: string
                      model:
                        type: string
                      url:
                        type: string
                    type: object
                  gpu:
                    description: Request one nvidia.com/gpu for rag-celery (upstream
                      default). Without it, ingestion runs on CPU.
                    type: boolean
                type: object
              resources:
                additionalProperties:
                  description: ResourceRequirements describes the compute resource
                    requirements.
                  properties:
                    claims:
                      description: |-
                        Claims lists the names of resources, defined in spec.resourceClaims,
