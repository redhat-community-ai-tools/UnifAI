apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: unifai-devel
resources:
  - crds
  - deploy/rbac.yaml
  - deploy/deployment.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: unifai-operator-src
    files:
      - operator/unifai_operator.py
      - operator/client.py
      - operator/requirements.txt
