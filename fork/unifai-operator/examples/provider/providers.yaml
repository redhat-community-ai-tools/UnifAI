# MCP server without credentials (examples/demo-backends/demo_mcp.py)
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiProvider
metadata: {name: demo-mcp}
spec:
  type: mcp_server
  config:
    mcp_url: http://unifai-demo-mcp:8004/sse
    transport_type: sse
    auth_method: access_token
    tool_names: [utc_now, echo]
---
# MCP server with a bearer token taken from a Secret (the demo server ignores it)
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiProvider
metadata: {name: demo-mcp-token}
spec:
  type: mcp_server
  config:
    mcp_url: http://unifai-demo-mcp:8004/sse
    transport_type: sse
    auth_method: access_token
    tool_names: [echo]
  secretRefs:
    - {path: bearer_token, secretKeyRef: {name: unifai-demo-secrets, key: mcp-bearer}}
