# Reads documents ingested in the RAG (see examples/rag). `docs` lists RAG source ids; empty = all documents of the owner
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiRetriever
metadata: {name: demo-docs}
spec:
  type: docs_rag
  config: {top_k_results: 5, threshold: 0.3, timeout: 30}
---
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiRetriever
metadata: {name: demo-docs-wide}
spec:
  type: docs_rag
  config: {top_k_results: 10, threshold: 0.2, timeout: 60}
