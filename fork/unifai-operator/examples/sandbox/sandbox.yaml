# NOT applied on demo333: needs an OpenShell gateway. PEMs come from a Secret (kubectl create secret generic openshell-pki --from-file=ca.pem ...)
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiSandbox
metadata: {name: demo-openshell}
spec:
  type: openshell_sandbox
  config:
    gateway_url: https://openshell-gateway.example.com:8443
    workdir: /sandbox
    keep_sandbox: false
  secretRefs:
    - {path: ca_cert, secretKeyRef: {name: openshell-pki, key: ca.pem}}
    - {path: tls_cert, secretKeyRef: {name: openshell-pki, key: tls.crt}}
    - {path: tls_key, secretKeyRef: {name: openshell-pki, key: tls.key}}
