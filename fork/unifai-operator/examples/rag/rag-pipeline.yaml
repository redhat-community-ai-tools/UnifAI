# Ingests documents through rag-server (upload -> collect -> chunk 500/50 -> embed -> Qdrant `document_data`).
# Requires rag-celery running (GPU request / CPU embeddings) and working Docling/embedding services: see README "RAG data pipeline".
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiRAGPipeline
metadata: {name: demo-docs}
spec:
  owner: admin
  documents:
    - name: unifai-demo-notes.md
      tags: [demo, notes]
      source:
        inline: |
          # UnifAI demo notes
          The startx demo cluster hosts UnifAI in the namespace unifai-devel.
          Objects are declared with the unifai.startx.fr custom resources.
    - name: operator-readme.md
      tags: [demo]
      source:
        configMapKeyRef: {name: unifai-demo-docs, key: operator-readme.md}
