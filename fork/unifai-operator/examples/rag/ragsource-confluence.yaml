# A Confluence space subtree kept in the RAG service and re-synced incrementally every 6 hours: only new or
# changed pages are re-embedded, vanished pages are removed. Shared with members of the listed OIDC groups.
# Prerequisites on the UnifaiStack:
#   spec.rag.confluence.token (+ username for Cloud basic auth) -> the Secret below
#   spec.rag.sharedPublishers: [admin]   (the owner of a shared source)
#   spec.rag.hybrid: true                (optional: dense + BM25 search)
apiVersion: v1
kind: Secret
metadata: {name: confluence-credentials}
stringData:
  username: bot@example.com
  token: REPLACE-WITH-API-TOKEN
---
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiRAGSource
metadata: {name: tech-procedures}
spec:
  owner: admin
  type: confluence
  confluence:
    baseUrl: https://example.atlassian.net
    spaceKey: SXSI
    rootTitle: "Technologie : OpenShift"
    excludeLabels: [archived]
  visibility: shared
  aclGroups: [agent_tekos, consultants]
  syncInterval: 6h
