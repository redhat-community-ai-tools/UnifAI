# Full stack with a Keycloak deployed by the operator (RHBK installed in the namespace, Crunchy database when available).
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiStack
metadata:
  name: unifai           # mandatory name: one stack per namespace
spec:
  profile: dev
  identity:
    adminUsers: [admin]
    keycloak: {}
  storage:
    className: gp3-csi
    sharedClassName: nfs
  nodeSelector:
    workload: unifai
