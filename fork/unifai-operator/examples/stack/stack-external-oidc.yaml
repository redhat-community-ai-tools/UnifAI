# Stack using an existing Keycloak realm: create the client secret first
#   kubectl create secret generic unifai-oidc --from-literal=client-secret=...
# and add https://unifai-{ui,identity}-<namespace>.<apps domain>/* to the client redirect URIs.
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiStack
metadata:
  name: unifai
spec:
  profile: dev
  version: devel
  identity:
    adminUsers: [admin]
    external:
      url: https://keycloak.apps.demo333.startx.fr
      realm: unifai
      clientId: unifai
      clientSecret: {name: unifai-oidc, key: client-secret}
  storage:
    className: gp3-csi
    sharedClassName: nfs
  rag:
    docling: {mode: local}
    embedding: {mode: local}
  deletionPolicy: Retain
