# unifai-devel on demo333: the helmfile deployment taken over by the operator (existing volumes and keys are kept).
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiStack
metadata:
  name: unifai
  namespace: unifai-devel
spec:
  profile: dev
  # Immutable tag of the UnifAI images (fork devel with the internal authentication fix, 2026-10-22).
  version: devel-c790ee45c
  identity:
    adminUsers: [admin]
    external:
      url: https://keycloak.apps.demo333.startx.fr
      realm: unifai
      clientId: unifai
      clientSecret: {name: unifai-oidc, key: client-secret}
  storage:
    className: gp3-csi
    sharedClassName: nfs
  deletionPolicy: Retain
