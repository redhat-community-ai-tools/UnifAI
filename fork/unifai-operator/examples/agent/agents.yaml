# ReAct agent: LLM + MCP provider + web_fetch tool
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiAgent
metadata: {name: demo-agent}
spec:
  type: custom_agent_node
  config:
    llm: $ref:llm/demo-fake
    providers: [$ref:provider/demo-mcp]
    tools: [$ref:tool/demo-web-fetch]
    system_message: You are a concise assistant.
    strategy_type: react
    max_rounds: 10
    hitl_mode: skip
---
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiAgent
metadata: {name: demo-agent-b}
spec:
  type: custom_agent_node
  config:
    llm: $ref:llm/demo-fake
    system_message: You summarize what you are given.
    max_rounds: 5
    hitl_mode: skip
---
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiAgent
metadata: {name: demo-orchestrator}
spec:
  type: orchestrator_node
  config:
    llm: $ref:llm/demo-fake
    system_message: You coordinate the other agents of the workflow.
    max_rounds: 10
---
# Remote agent over the A2A protocol (adjust base_url)
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiAgent
metadata: {name: demo-a2a}
spec:
  type: a2a_agent_node
  config:
    base_url: http://a2a-agent.my-namespace.svc:9999
    auth_method: none
