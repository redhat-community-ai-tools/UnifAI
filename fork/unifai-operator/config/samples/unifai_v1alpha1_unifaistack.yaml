apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiStack
metadata:
  name: unifai
spec:
  profile: dev
  identity:
    adminUsers:
    - admin
    keycloak:
      database:
        type: auto
  storage:
    className: gp3-csi
    sharedClassName: nfs
  rag:
    docling:
      mode: local
    embedding:
      mode: local
