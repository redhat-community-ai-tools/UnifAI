apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiTemplate
metadata:
  name: demo-chat-quickstart
spec:
  owner: admin
  draft:
    name: Demo Chat Quickstart
    description: One Gemini agent answering questions.
    llms:
    - rid: llm_rid
      name: gemini
      type: google_genai
      config:
        type: google_genai
        model_name: gemini-3.5-flash
        api_key: PLACEHOLDER_API_KEY
    nodes:
    - rid: user_question
      name: User Question Node
      type: user_question_node
      config:
        type: user_question_node
        retries: 1
    - rid: final_answer
      name: Final Answer Node
      type: final_answer_node
      config:
        type: final_answer_node
        retries: 1
    - rid: agent_rid
      name: Assistant
      type: custom_agent_node
      config:
        type: custom_agent_node
        llm: llm_rid
        system_message: You are a helpful assistant.
        hitl_mode: skip
    plan:
    - uid: ask
      node: user_question
    - uid: answer
      node: agent_rid
      after: ask
    - uid: finish
      node: final_answer
      after: answer
  placeholders:
    categories:
    - category: llms
      resources:
      - rid: llm_rid
        placeholders:
        - field_path: api_key
          required: true
          label: Gemini API key
          hint: Google AI Studio key
  metadata:
    author: startx
    version: 1.0.0
    is_public: true
    category: Chat
    tags:
    - chat
    - quickstart
