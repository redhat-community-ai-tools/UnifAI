apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiWorkflow
metadata:
  name: demo-linear
spec:
  description: question -> demo-agent -> answer
  blueprint:
    nodes:
    - rid: user_question
      name: User Question Node
      type: user_question_node
      config:
        type: user_question_node
        retries: 1
    - rid: final_answer
      name: Final Answer Node
      type: final_answer_node
      config:
        type: final_answer_node
        retries: 1
    - rid: $ref:agent/demo-agent
    conditions:
    - rid: $ref:condition/demo-direct
    plan:
    - uid: ask
      node: user_question
      exit_condition: $rid:condition/demo-direct
      branches:
        agent: agent
    - uid: agent
      node: $rid:agent/demo-agent
    - uid: finish
      node: final_answer
      after: agent
