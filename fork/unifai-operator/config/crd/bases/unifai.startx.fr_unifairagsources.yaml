---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: unifairagsources.unifai.startx.fr
spec:
  group: unifai.startx.fr
  names:
    categories:
    - unifai
    kind: UnifaiRAGSource
    listKind: UnifaiRAGSourceList
    plural: unifairagsources
    shortNames:
    - uragsrc
    singular: unifairagsource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.pages
      name: Pages
      type: integer
    - jsonPath: .status.lastSyncTime
      name: LastSync
      type: date
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UnifaiRAGSource keeps a RAG source (e.g. a Confluence space)
          ingested and incrementally re-synced.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              UnifaiRAGSourceSpec is a RAG source kept in sync on a schedule. Credentials are stack-wide
              (UnifaiStack.spec.rag.confluence).
            properties:
              aclGroups:
                description: OIDC groups allowed to retrieve a shared source.
                items:
                  type: string
                type: array
              confluence:
                description: 'RAGConfluenceSource scopes a Confluence source: one
                  space, optionally narrowed to the subtree under a root page.'
                properties:
                  baseUrl:
                    description: Site URL, e.g. https://example.atlassian.net (Cloud)
                      or https://confluence.example.com (Data Center).
                    pattern: ^https?://
                    type: string
                  excludeLabels:
                    description: Pages carrying one of these labels are skipped.
                    items:
                      type: string
                    type: array
                  rootTitle:
                    description: Title of the root page whose subtree is ingested
                      (the page included); empty = the whole space.
                    type: string
                  spaceKey:
                    type: string
                required:
                - baseUrl
                - spaceKey
                type: object
              owner:
                default: admin
                description: UnifAI user owning the object (workspace identity).
                type: string
              suspend:
                description: Stop scheduled syncs.
                type: boolean
              syncInterval:
                description: Time between incremental syncs (minimum 10m). Unset =
                  sync only when the spec changes.
                type: string
              tags:
                description: |-
                  Tags put on the source, so a search can be scoped to a domain (query tags=<tag>) instead of "every
                  source the caller can see". Changing them registers the source again (no page is re-embedded).
                items:
                  type: string
                type: array
              teamId:
                description: Team workspace to use instead of the user's personal
                  one.
                type: string
              teamRef:
                description: |-
                  UnifaiTeam (same namespace) whose team workspace to use; the object waits until the team is Ready.
                  Exclusive with teamId.
                type: string
              type:
                enum:
                - confluence
                type: string
              unifaiName:
                description: Name in UnifAI (defaults to metadata.name).
                type: string
              visibility:
                default: private
                description: private (owner only) or shared (owner + members of aclGroups).
                enum:
                - private
                - shared
                type: string
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: confluence settings are required for type confluence
              rule: self.type != 'confluence' || has(self.confluence)
            - message: a shared source needs at least one ACL group
              rule: self.visibility != 'shared' || (has(self.aclGroups) && size(self.aclGroups)
                > 0)
          status:
            description: UnifaiRAGSourceStatus reports the last sync.
            properties:
              blueprintId:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              hash:
                description: Truncated SHA-256 of the resolved spec last pushed to
                  UnifAI.
                type: string
              lastReconciled:
                format: date-time
                type: string
              lastSyncTime:
                format: date-time
                type: string
              message:
                type: string
              nextSyncTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              pages:
                type: integer
              pagesChanged:
                type: integer
              pagesDeleted:
                type: integer
              phase:
                description: Ready, Error, Pending, Running, Completed, Failed, Submitted,
                  Suspended.
                type: string
              pipelineStatus:
                description: Pipeline status reported by the RAG service (PENDING
                  ... DONE, FAILED).
                type: string
              response:
                description: RAG pipeline dispatch response (truncated JSON).
                type: string
              result:
                description: Chat transcript (truncated JSON).
                type: string
              rid:
                description: Id of the UnifAI library resource.
                type: string
              scheduleId:
                type: string
              sessionId:
                type: string
              sourceId:
                description: Id of the source in the RAG service.
                type: string
              teamId:
                description: Id of the identity team (UnifaiTeam).
                type: string
              templateId:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
