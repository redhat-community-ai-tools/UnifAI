                      mongo:
                        type: string
                    type: object
                  retention:
                    default: 7
                    description: Backups kept per store; older ones are deleted after
                      each successful run.
                    minimum: 1
                    type: integer
                  s3:
                    description: BackupS3Spec locates the bucket. The credentials
                      Secret holds AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
                    properties:
                      bucket:
                        pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
                        type: string
                      credentialsSecret:
                        type: string
                      endpoint:
                        description: Endpoint URL of a non-AWS S3 service (e.g. https://s3.example.com);
                          empty = AWS.
                        pattern: ^https?://[A-Za-z0-9.:\[\]_-]+(/[A-Za-z0-9._~/-]*)?$
                        type: string
                      prefix:
                        description: 'Key prefix (default: unifai/<namespace>).'
                        pattern: ^[A-Za-z0-9._/-]*$
                        type: string
                      region:
                        default: us-east-1
                        type: string
                    required:
                    - bucket
                    - credentialsSecret
                    type: object
                  schedule:
                    default: 0 2 * * *
                    description: Cron schedule of both backup CronJobs.
                    type: string
                  suspend:
                    description: Suspend both CronJobs.
                    type: boolean
                required:
                - s3
                type: object
              deletionPolicy:
                default: Retain
                description: Retain keeps PVCs, the generated secret and the Keycloak
                  database when the stack is deleted; Delete removes them.
                enum:
                - Retain
                - Delete
                type: string
              exposure:
                description: ExposureSpec configures how the stack is reached from
                  outside the namespace.
                properties:
                  domain:
                    description: Apps domain used to build hosts. Empty = OpenShift
                      cluster ingress domain.
                    type: string
                  exposeInternal:
                    description: |-
                      Also create the upstream Routes of internal services (mongodb, qdrant, redis-insight, temporal, backend, multiagent-be).
                      They have no authentication: keep false outside of debugging.
                    type: boolean
                  identityHost:
                    description: 'Identity host. Default: unifai-identity-<namespace>.<domain>.'
                    type: string
                  networkPolicy:
                    default: true
                    description: |-
                      Restrict ingress to the namespace, the OpenShift router and the operator, and the UnifAI APIs (MAS, RAG,
                      identity, backend) to the UnifAI pods and the pods labelled unifai.startx.fr/internal-client=true.
                      When false, the NetworkIsolated condition is False.
                    type: boolean
                  ragClients:
                    description: |-
                      Callers outside the stack namespace admitted to the RAG server only (not MAS, identity or backend), e.g. a
                      gateway using the RAG search API. Each entry admits the pods of a namespace, or those with the given labels.
                    items:
                      description: RAGClient admits pods of another namespace to the
                        RAG server.
                      properties:
                        namespace:
                          description: Namespace of the callers.
                          minLength: 1
                          type: string
                        podLabels:
                          additionalProperties:
                            type: string
                          description: Labels the calling pods must carry (all pods
                            of the namespace when empty).
                          type: object
                      required:
                      - namespace
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - namespace
                    x-kubernetes-list-type: map
                  uiHost:
                    description: 'UI host. Default: unifai-ui-<namespace>.<domain>.'
                    type: string
                type: object
              extraEnv:
                additionalProperties:
                  items:
                    description: EnvVar represents an environment variable present
