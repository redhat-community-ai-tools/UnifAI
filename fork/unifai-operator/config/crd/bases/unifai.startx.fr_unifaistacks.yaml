                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      userToken:
                        description: SecretKeySelector selects a key of a Secret in
                          the CR's namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  umami:
                    description: UmamiSpec configures UI analytics.
                    properties:
                      password:
                        description: SecretKeySelector selects a key of a Secret in
                          the CR's namespace.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      url:
                        type: string
                      username:
                        description: SecretKeySelector selects a key of a Secret in
