                        properties:
                          image:
                            description: PostgreSQL image of the StatefulSet mode.
                            type: string
                          type:
                            default: auto
                            description: auto = Crunchy PostgresCluster when the Crunchy
                              operator serves this namespace, else a PostgreSQL StatefulSet.
                            enum:
                            - auto
                            - crunchy
                            - statefulset
                            type: string
                        type: object
                      host:
                        description: 'Keycloak host. Default: unifai-keycloak-<namespace>.<domain>.'
                        type: string
                      installOperator:
                        default: true
                        description: Install the RHBK operator in the namespace (OperatorGroup
                          + Subscription) when it does not serve it yet.
                        type: boolean
                    type: object
                type: object
