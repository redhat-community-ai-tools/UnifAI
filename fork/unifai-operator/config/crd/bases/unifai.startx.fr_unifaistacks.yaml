    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UnifaiStack deploys a complete UnifAI platform in its namespace
          (at most one per namespace, named `unifai`).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: UnifaiStackSpec defines a complete UnifAI deployment in the
              namespace of the resource.
            properties:
              backup:
                description: Scheduled backups of MongoDB (mongodump archive) and
                  Qdrant (one snapshot per collection) to S3.
                properties:
                  images:
                    description: 'Image overrides (defaults: public.ecr.aws/aws-cli/aws-cli
                      and docker.io/library/mongo, pinned).'
