---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: unifaiagentbundles.unifai.startx.fr
spec:
  group: unifai.startx.fr
  names:
    categories:
    - unifai
    kind: UnifaiAgentBundle
    listKind: UnifaiAgentBundleList
    plural: unifaiagentbundles
    shortNames:
    - uab
    singular: unifaiagentbundle
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.agent
      name: Agent
      type: string
    - jsonPath: .status.verified
      name: Verified
      type: boolean
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UnifaiAgentBundle turns a signed Zuno OKF agent bundle into UnifAI
          LLMs, agents, a condition and workflows.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: UnifaiAgentBundleSpec maps one signed OKF agent bundle onto
              UnifAI objects.
            properties:
              agentConfig:
                description: Extra custom_agent_node settings merged under every emitted
                  agent (e.g. max_rounds, hitl_mode).
                type: object
                x-kubernetes-preserve-unknown-fields: true
              ceilings:
                description: |-
                  BundleCeilings bound what a bundle may declare (ADR-0564 clause 3): a bundle can narrow, never widen.
                  They are reviewed in Git with the CR, independently of the bundle content.
                properties:
                  knowledgeDomains:
                    description: Knowledge domains the bundle's tasks may declare
                      in allowed_knowledge.
                    items:
                      type: string
                    type: array
                  minClassification:
                    description: |-
                      The least restrictive classification the bundle may run at (C1 < C2 < C3): a bundle declaring a lower
                      level than this would allow model classes the CR's reviewers did not accept.
                    enum:
                    - C1
                    - C2
                    - C3
                    type: string
                  toolCapabilities:
                    description: Tool names the bundle's tasks may declare in allowed_tools.
                    items:
                      type: string
                    type: array
                required:
                - minClassification
                type: object
              classificationOverrides:
                additionalProperties:
                  type: string
                description: 'Per-task classification override: C1, C2 or C3. It may
                  only raise the bundle''s level (ADR-0565).'
                type: object
              entitlement:
                default: Enforced
                description: |-
                  How zuno.access.groups is honoured. Enforced (default) refuses a bundle declaring groups while UnifAI
                  cannot gate agent visibility by group; GatewayOnly emits it and relies on the gateways checking the
                  caller's JWT groups (ADR-0562 interim; a cutover gate for production).
                enum:
                - Enforced
                - GatewayOnly
                type: string
              llm:
                description: |-
                  BundleLLM is the template of the LLM emitted for every task: the bundle adds the Zuno headers
                  (agent, task, effective classification, run id) to `config.default_headers`.
                properties:
                  config:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  secretRefs:
                    items:
                      description: SecretRef injects a Secret value at a dotted path
                        of the UnifAI config.
                      properties:
                        path:
                          description: Dotted path in the config, e.g. `api_key` or
                            `headers.token`.
                          type: string
                        secretKeyRef:
                          description: SecretKeySelector selects a key of a Secret
                            in the CR's namespace.
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - path
                      - secretKeyRef
                      type: object
                    type: array
                  type:
                    default: openai_compatible
                    enum:
                    - openai_compatible
                    type: string
                type: object
              owner:
                default: admin
                description: UnifAI user owning the object (workspace identity).
                type: string
              providers:
                description: UnifaiProvider names (MCP servers) attached to the tasks
                  that declare allowed_tools.
                items:
                  type: string
                type: array
              retriever:
                description: UnifaiRetriever name attached to the tasks that declare
                  allowed_knowledge.
                type: string
              source:
                description: BundleSource says where the bundle comes from.
                properties:
                  oci:
                    description: OCIBundleSource pins a signed OKF bundle in an OCI
                      registry.
                    properties:
                      pullSecretRef:
                        description: kubernetes.io/dockerconfigjson Secret for a private
                          repository (anonymous pull when unset).
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      reference:
                        description: Reference pinned by digest, e.g. quay.io/zuno/okf-tekos@sha256:<64
                          hex>. Tags are refused.
                        type: string
                        x-kubernetes-validations:
                        - message: reference must be pinned by a sha256 digest
                          rule: self.matches('^[^@]+@sha256:[a-f0-9]{64}$')
                    required:
                    - reference
                    type: object
                required:
                - oci
                type: object
              teamId:
                description: Team workspace to use instead of the user's personal
                  one.
                type: string
              unifaiName:
                description: Name in UnifAI (defaults to metadata.name).
                type: string
              verify:
                description: |-
                  BundleVerify says how the bundle signature is checked. The key is the PEM public half of the signing key
                  (for zuno, the Vault Transit key exported as agents/zuno-platform-signer.pub): no access to Vault is needed.
                properties:
                  publicKeyRef:
                    description: SecretKeySelector selects a key of a Secret in the
                      CR's namespace.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - publicKeyRef
                type: object
            required:
            - ceilings
            - llm
            - source
            - verify
            type: object
          status:
            description: UnifaiAgentBundleStatus reports verification and the emitted
              objects.
            properties:
              agent:
                description: zuno.name of the bundle.
                type: string
              bundleDigest:
                description: OKF content digest that the signature covers.
                type: string
              children:
                description: Emitted objects, as <Kind>/<name>.
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastReconciled:
                format: date-time
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              okfVersion:
                description: okf_version of the bundle.
                type: string
              phase:
                description: Ready, Error, Pending.
                type: string
              resolvedDigest:
                description: Manifest digest that was pulled.
                type: string
              tasks:
                items:
                  description: BundleTaskStatus is what was emitted for one task.
                  properties:
                    classification:
                      type: string
                    name:
                      type: string
                    workflow:
                      type: string
                  required:
                  - classification
                  - name
                  - workflow
                  type: object
                type: array
              unmapped:
                description: OKF content with no UnifAI equivalent.
                items:
                  type: string
                type: array
              verified:
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
