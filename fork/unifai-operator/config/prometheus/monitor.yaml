# Scraped by the OpenShift user-workload monitoring when the operator runs in its own namespace (unifai-operator):
# both Prometheus stacks ignore openshift-* namespaces. User-workload monitoring rejects bearerTokenFile, so the
# token of the scraper ServiceAccount (CSV clusterPermissions, GET /metrics) comes from a Secret the operator creates
# (internal/controller/metricstoken.go). The metrics server certificate is self-signed: the token is what protects
# the endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: unifai-operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: https
      scheme: https
      authorization:
        type: Bearer
        credentials:
          name: unifai-operator-metrics-token
          key: token
      tlsConfig:
        insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: unifai-operator
