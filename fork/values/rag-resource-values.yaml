# Overlay merged over helm/values/rag-resource-values.yaml.
unifai_rag_server:
  env:
    DOCLING_SERVICE_URL: "${DOCLING_URL}"
    EMBEDDING_SERVICE_URL: "${EMBEDDING_URL}"
unifai_rag_celery:
  env:
    DOCLING_SERVICE_URL: "${DOCLING_URL}"
    EMBEDDING_SERVICE_URL: "${EMBEDDING_URL}"
# The helmfile passes .Values.storage flat to the chart; the chart reads storage.className, hence the nested key.
storage:
  className: ${SHARED_STORAGE_CLASS}
  storage:
    className: ${SHARED_STORAGE_CLASS}
