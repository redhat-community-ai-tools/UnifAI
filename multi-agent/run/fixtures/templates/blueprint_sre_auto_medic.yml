placeholders:
  categories:
    - category: llms
      resources:
        - rid: llm_rid
          placeholders:
            - field_path: api_key
              required: true
              label: Gemini (Google) API Key
              hint: "Your Google GenAI API key for Gemini models"
    - category: tools
      resources:
        - rid: oc_tool_rid
          placeholders:
            - field_path: server
              required: true
              label: OpenShift API Server URL
              hint: "e.g. https://api.ocp-cluster.example.com:6443"
            - field_path: token
              required: true
              label: OpenShift Auth Token
              hint: "oc login token (oc whoami -t)"
        - rid: ssh_tool_rid
          placeholders:
            - field_path: host
              required: true
              label: RHEL Node IP / Hostname
              hint: "IP or hostname of the target RHEL node"
            - field_path: username
              required: true
              label: SSH Username
              hint: "e.g. root, sre-user"
            - field_path: password
              required: true
              label: SSH Password
              hint: "Password for the SSH user"
    - category: providers
      resources:
        - rid: jira_mcp_rid
          placeholders:
            - field_path: bearer_token
              required: true
              label: Jira PAT Token
              hint: "Your Jira Personal Access Token for API access"

