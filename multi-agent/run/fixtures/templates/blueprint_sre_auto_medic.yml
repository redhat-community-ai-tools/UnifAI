metadata:
  author: UnifAI
  version: "1.0.0"
  is_public: true
  category: SRE & Incident Response
  tags:
    - sre
    - incident-response
    - openshift
    - rhel
    - jira
    - auto-triage
  output_capabilities:
    - incident-report
    - jira-ticket
    - root-cause-analysis
