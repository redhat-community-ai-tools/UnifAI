metadata:
  author: UnifAI
  version: "1.0.0"
  is_public: true
  category: Security & Compliance
  tags:
    - compliance
    - soc2
    - audit
    - git
    - google-workspace
    - security
    - change-management
    - continuous-monitoring
  output_capabilities:
    - compliance-report
    - violation-tracking
    - policy-analysis
    - audit-trail
