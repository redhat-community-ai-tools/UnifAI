      resources:
        - rid: llm_rid
          placeholders:
            - field_path: api_key
              required: true
              label: Gemini (Google) API Key
              hint: "Your Google GenAI API key for Gemini models"
    - category: providers
      resources:
        - rid: confluence_mcp_rid
          placeholders:
            - field_path: bearer_token
              required: true
              label: Confluence PAT Token
              hint: "Your Atlassian Personal Access Token for Confluence access"
        - rid: jira_mcp_rid
          placeholders:
            - field_path: bearer_token
              required: true
              label: Jira PAT Token
              hint: "Your Jira Personal Access Token for API access"
        - rid: git_mcp_rid
          placeholders:
            - field_path: bearer_token
              required: true
              label: Git Personal Access Token
              hint: "Your Git/GitHub Personal Access Token for repository access"

