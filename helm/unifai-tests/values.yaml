# --------------------------------------------------------------------------
# Test runner configuration
# --------------------------------------------------------------------------

# Test suite to execute (passed as arg to run_tests.sh).
# Options: all, rag, rag-unit, rag-e2e, multi-agent, multi-agent-unit,
#          multi-agent-e2e, multi-agent-integration, identity, identity-smoke, identity-unit, debug
testSuite: "rag"

# Extra pytest CLI arguments appended after the suite name
extraArgs: ""

image:
  repository: images.paas.redhat.com/unifai/unifai-tests
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Environment variables injected into the test-runner container
env:
  # RAG service
  API_BASE_URL: "http://unifai-rag-server:13456/api"
  # Multi-Agent service
  MULTIAGENT_BASE_URL: "http://unifai-multiagent-be:8003/api"
  # MongoDB (shared by RAG Celery and Multi-Agent)
  MONGODB_HOST: "mongodb"
  MONGODB_PORT: "27017"
  MONGODB_DB: "celery"
  # Pytest log level (--log-cli-level)
  LOG_LEVEL: "INFO"
  # RAG stress test defaults
  NUM_DOCUMENTS: "10"
  CONCURRENT_UPLOADS: "10"
  PAGES_PER_DOC: "2"
  TEST_PROFILE: "complex"        # simple | complex
  RANDOMIZE: "true"
  MIN_DOCUMENTS: "10"
  MAX_DOCUMENTS: "50"
  MIN_PAGES_PER_DOC: "5"
  MAX_PAGES_PER_DOC: "30"
  UPLOAD_TIMEOUT: "300"
  UPLOAD_MAX_RETRIES: "3"

resources:
  limits:
    cpu: 2
    memory: 4Gi
  requests:
    cpu: 1
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# --------------------------------------------------------------------------
# Test reports
# When enabled, pytest writes HTML/XML reports to a PVC and the test-runner
# pod starts a Python HTTP server after tests complete so reports are
# browsable via the Route.
# --------------------------------------------------------------------------
reports:
  enabled: true

  storage:
    size: 1Gi
    className: aws-efs-tier-c1
    accessModes:
      - ReadWriteMany
    annotations:
      kubernetes.io/reclaimPolicy: Delete
    labels:
      paas.redhat.com/appcode: TAG-001

  service:
    type: ClusterIP
    port: 8080

  route:
    enabled: true
    host: ""
