{{- $createPvc := and (empty .Values.storage.persistentVolumeClaimName) (.Values.storage.requestedSize) }}
{{- if $createPvc }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "unifai-dataflow-shared-storage.fullname" . }}
  labels:
    {{- include "unifai-dataflow-shared-storage.labels" . | nindent 4 }}
    {{- with .Values.storage.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if hasKey .Values.global "syncWave" }}
    argocd.argoproj.io/sync-wave: {{ .Values.global.syncWave | quote }}
    {{- end }}
    {{- if .Values.storage.keepPvc }}
    "helm.sh/resource-policy": keep
    {{- end }}
    {{- with .Values.storage.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.storage }}
  accessModes:
    {{- toYaml .accessModes | nindent 4 }}
  volumeMode: Filesystem
  resources:
    requests:
      storage: {{ .requestedSize }}
  {{- if .className }}
  storageClassName: {{ .className }}
  {{- end }}
  {{- end }}
{{- end }}
