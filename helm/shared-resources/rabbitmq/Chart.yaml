annotations:
  category: Infrastructure
  images: |
    - name: os-shell
      image: docker.io/bitnami/os-shell:12-debian-12-r34
    - name: rabbitmq
      image: docker.io/bitnami/rabbitmq:4.0.5-debian-12-r0
  licenses: Apache-2.0
apiVersion: v2
appVersion: 4.0.5
# common is vendored in charts/common: declared without a repository, so helm checks it and never downloads it.
dependencies:
- name: common
  tags:
  - bitnami-common
  version: 2.28.0
description: RabbitMQ is an open source general-purpose message broker that is designed
  for consistent, highly-available messaging scenarios (both synchronous and asynchronous).
home: https://bitnami.com
icon: https://bitnami.com/assets/stacks/rabbitmq/img/rabbitmq-stack-220x234.png
keywords:
- rabbitmq
- message queue
- AMQP
maintainers:
- name: Broadcom, Inc. All Rights Reserved.
  url: https://github.com/bitnami/charts
name: rabbitmq
sources:
- https://github.com/bitnami/charts/tree/main/bitnami/rabbitmq
version: 15.2.1
