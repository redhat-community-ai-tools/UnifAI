apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    {{- include "logging.labels" . | nindent 4 }}
  name: {{ include "logging.fullname" . }}
spec:
  #host: unifai-sso-backend-tag-ai--pipeline.apps.stc-ai-e1-pp.imap.p1.openshiftapps.com
  port:
    targetPort: {{ .Values.service.port_ui }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: None
  to:
    kind: Service
    name: {{ include "logging.fullname" . }}
    weight: 100
  wildcardPolicy: None
