apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logging.fullname" . }}-base
  labels:
    {{- include "logging.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      transform/enrich:
        log_statements:
          - context: resource
            statements:
              - set(attributes["_sourceCategory"], Concat(["otel/unifai", attributes["service.name"]], "/"))
              - set(attributes["_sourceHost"], attributes["host.name"]) where attributes["host.name"] != nil
      filter/health:
        error_mode: ignore
        log_conditions:
          # OTLP log bodies are the application's JSON-formatted log line.
          - 'IsMatch(log.body, "\"logger\": \"werkzeug\"") and IsMatch(log.body, "GET /api/health/?") and IsMatch(log.body, " 200 ")'
      batch: {}
    exporters:
      debug:
        verbosity: basic
      sumologic:
        endpoint: ${env:SUMOLOGIC_ENDPOINT}  
      otlphttp:
        endpoint: "https://otel-input.corp.redhat.com:4318"
        tls:
          insecure_skip_verify: true
        headers:
          Authorization: "Bearer ${env:OTEL_AUTH_TOKEN}"
    extensions:
      zpages:
        endpoint: 0.0.0.0:55679
    service:
      extensions: [zpages]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [transform/enrich, filter/health, batch]
          exporters: [debug, otlphttp]
