mongodb:
  image:
    registry: "images.paas.redhat.com/genie"
    repository: "mongo"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 27017
  env: []  # Explicit empty array to prevent marshaling error

# Global env override - ensure MongoDB uses array format
global:
  mongodb:
    env: []

qdrant:
  replicaCount: 1
  image:
    registry: "images.paas.redhat.com/genie"
    repository: "qdrant"
    pullPolicy: IfNotPresent
    tag: "stable"
  service:
    type: LoadBalancer
    port: 6333
  resources:
    limits:
      cpu: 8
      memory: 16Gi
    requests:
      cpu: 4
      memory: 12Gi

rabbitmq:
  image:
    registry: images.paas.redhat.com/genie
    repository: rabbitmq
    pullPolicy: IfNotPresent
    tag: 4.0.5-debian-12-r0
  service:
    type: LoadBalancer

storage:
  volumeName: unifai-dataflow-shared-storage
  requestedSize: 100Gi
  className: aws-efs-tier-c1
  accessModes:
    - ReadWriteMany
  annotations:
    kubernetes.io/reclaimPolicy: Delete
  labels:
    paas.redhat.com/appcode: TAG-001

docling:
  #image:
  #  registry: "images.paas.redhat.com/genie"
  #  repository: "docling"
  #  pullPolicy: IfNotPresent
  #  tag: "latest"
  service:
    type: LoadBalancer
    port: 5001
  resources:
    limits:
      cpu: 4
      memory: 8Gi
    requests:
      cpu: 2
      memory: 4Gi
        #healthCheck:
        #enabled: true
        #path: "/health"
        #port: 5001
        #api:
        #version: "v1alpha"
        #timeout: 300
