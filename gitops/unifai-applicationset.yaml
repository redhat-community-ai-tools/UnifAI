---
apiVersion: v1
kind: Secret
metadata:
  name: unifai-config-private-repo
  namespace: tag-ai--runtime-int
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  type: git
  url: https://gitlab.cee.redhat.com/gzhou/unifai-gitops-priv.git
  insecure: "true"  
  username: oauth2
