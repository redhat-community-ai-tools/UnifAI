name: PIP Audit Dependency Security Scan

permissions:
  contents: read

on: 
    #currently we'll run this only upon request and not automatically.
    # push:
    #     branches:
    #         - GENIE-1354-dependency_scanning
    pull_request:
      branches:
        - main
    workflow_dispatch:
      inputs:
        branch:
          description: 'Branch to scan'
          required: true
          default: 'main'

jobs:

    scan_backend:
        runs-on: ubuntu-latest
        steps:

        - name: Checkout code
          uses: actions/checkout@v4
          with:
            ref: ${{ inputs.branch }}
          
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
            cache: 'pip'

        - name: setup virtual environment (backend)
          run: python3 -m venv venv
    
        - name: Install python requirements (backend)
          run: | 
            ./venv/bin/pip install --upgrade pip "setuptools>=70.0.0"
            ./venv/bin/pip install -e backend/
            ./venv/bin/pip install -e './global_utils/[backend]'

        - name: Scan dependencies (backend)
          uses: pypa/gh-action-pip-audit@v1.1.0
          with:
            local: true
            virtual-environment: venv/
            summary: true

    scan_rag:
      runs-on: ubuntu-latest
      permissions:
        contents: read
      steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
        
      - name: setup virtual environment (rag)
        run: python3 -m venv venv

      - name: Install python requirements (rag)
        run: | 
          ./venv/bin/pip install --upgrade pip "setuptools>=70.0.0"
          ./venv/bin/pip install -e ./rag/
          ./venv/bin/pip install -e './global_utils/[rag]'

      - name: Scan dependencies (rag)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          local: true
          virtual-environment: venv/
          summary: true

    scan_multi-agent:
      runs-on: ubuntu-latest
      permissions:
        contents: read
      steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
        
      - name: setup virtual environment (multi-agent)
        run: python3 -m venv venv

      - name: Install python requirements (multi-agent)
        run: | 
          ./venv/bin/pip install --upgrade pip "setuptools>=70.0.0"
          ./venv/bin/pip install -e './multi-agent/[all]'
          ./venv/bin/pip install -e './global_utils/[multi-agent]'

      - name: Scan dependencies (multi-agent)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          local: true
          virtual-environment: venv/
          summary: true

    scan_identity:
      runs-on: ubuntu-latest
      permissions:
        contents: read
      steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
        
      - name: setup virtual environment (identity)
        run: python3 -m venv venv

      - name: Install python requirements (identity)
        run: | 
          ./venv/bin/pip install --upgrade pip "setuptools>=70.0.0"
          ./venv/bin/pip install -e shared-resources/identity/
          ./venv/bin/pip install -e './global_utils/[identity]'

      - name: Scan dependencies (identity)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          local: true
          virtual-environment: venv/
          summary: true

    analyze:
        needs: [scan_backend, scan_rag, scan_multi-agent, scan_identity]
        if: always() && contains(needs.*.result, 'failure')
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        steps:

        - name: Generate Token
          id: generate_token
          #uses: tibdex/github-app-token@v2
          uses: actions/create-github-app-token@v2
          with:
            app-id: ${{ secrets.LOG_ANALYZER_APP_ID }}
            private-key: ${{ secrets.LOG_ANALYZER_PRIVATE_KEY }}

        - name: GitHub Actions Failure Analysis
          uses: calebevans/gha-failure-analysis@v0.1.9
          with:
            llm-provider: gemini
            llm-model: gemini-3.1-pro-preview
            llm-api-key: ${{ secrets.GEMINI_API_KEY }}
            github-token: ${{ steps.generate_token.outputs.token }}
            post-pr-comment: false