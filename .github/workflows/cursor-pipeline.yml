name: Cursor Pipeline Review

env:
  PIPELINE_MODEL: claude-4.6-opus-high-thinking

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run pipeline on (defaults to current branch)"
        required: false
        default: "main"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Resolve branch
        id: branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_BRANCH" ]; then
            echo "ref=$INPUT_BRANCH" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "ref=$PR_HEAD_REF" >> $GITHUB_OUTPUT
          else
            echo "ref=$GIT_REF_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.ref }}
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Validate model availability
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          MODEL_OUTPUT=$(agent --list-models 2>&1) || {
            echo "::error::Failed to list models. Output: $MODEL_OUTPUT"
            exit 1
          }
          if ! echo "$MODEL_OUTPUT" | grep -qF "$PIPELINE_MODEL"; then
            echo "::error::Model '$PIPELINE_MODEL' is not available. Available models:"
            echo "$MODEL_OUTPUT"
            exit 1
          fi

      # Security: --trust grants the agent full tool access (file read/write, shell).
      # --force skips interactive confirmation. The agent runs in a read-only
      # checkout (contents: read permission) so it cannot push changes. The
      # CURSOR_API_KEY is scoped to this organization's Cursor account only.
      - name: Run Architecture Review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          agent --trust --force -p "/pipeline arch-review" \
            --model "$PIPELINE_MODEL" 2>&1 | tee design_review_output.txt

      - name: Run Code Review
        if: success()
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          agent --trust --force -p "/pipeline code-review-only" \
            --model "$PIPELINE_MODEL" 2>&1 | tee code_review_output.txt

      - name: Publish results to Job Summary
        if: always()
        run: |
          echo "## Architecture Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f design_review_output.txt ]; then
            cat design_review_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "_No output produced._" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Code Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f code_review_output.txt ]; then
            cat code_review_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "_No output produced._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Evaluate Review Scores
        if: always()
        run: .github/scripts/evaluate-review-gate.sh
