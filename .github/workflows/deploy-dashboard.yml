name: CR Intelligence Dashboard

on:
  push:
    branches:
      - cr-intelligence-dashboard
    paths:
      - 'cr-intelligence/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r cr-intelligence/requirements.txt

      - name: Build dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: python cr-intelligence/scripts/build_dashboard.py

      - name: Deploy to docs folder
        run: |
          mkdir -p docs
          cp cr-intelligence/output/index.html docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Update CR Intelligence dashboard [skip ci]"
          git push
