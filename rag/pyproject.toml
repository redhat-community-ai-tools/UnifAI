[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "1.0.0"
description = "RAG Service"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    "flask",
    "flask-cors",
    "requests",
    "tiktoken",
    "langchain-text-splitters",
    "numpy",
    "qdrant-client",
    "pydantic==2.11.7",
    "umami-analytics",
    "pymongo",
    "webargs",
    # OpenTelemetry (inert unless OTEL_EXPORTER_OTLP_ENDPOINT is set)
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-flask>=0.66b1",
    "opentelemetry-instrumentation-requests>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-celery>=0.66b1",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*", "venv", "venv.*"]
