[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global_utils"
version = "1.0.0"
description = "Global shared utilities for UnifAI services"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
flask           = ["flask"]
apiargs         = ["webargs", "marshmallow"]
redis           = ["redis"]
celery          = ["celery"]
docling         = ["httpx>=0.25.0"]
embedding       = ["httpx>=0.25.0"]
async-bridge    = ["anyio"]
codegen         = ["datamodel-code-generator", "jsonschema"]
identity-client = ["requests"]
logging         = ["opentelemetry"]

rag             = ["global_utils[flask,apiargs,celery,docling,embedding,redis,logging]"]
backend         = ["global_utils[flask,apiargs,redis,logging]"]
multi-agent     = ["global_utils[flask,apiargs,async-bridge,codegen,identity-client,logging]"]
identity        = ["global_utils[flask,redis,identity-client,logging]"]

all             = ["global_utils[flask,apiargs,redis,celery,docling,embedding,async-bridge,codegen,identity-client]"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["global_utils*"]
