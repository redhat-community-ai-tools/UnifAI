# topology.yaml — Single source of truth for the UnifAI service graph.
# Drives: map edges, service detail schemes, dependency documentation.
# Updated by: extraction scripts, Cursor SDK agent, or manually.

services:
  # --- Layer 0: Entry point ---
  browser:
    type: EXTERNAL
    name: Browser
    icon: "\U0001F310"  # 🌐
    role: End-user entry point
    position: { x: 700, y: 50, w: 190, h: 54 }

  # --- Layer 1: Application services ---
  ui:
    type: APP
    name: UI / Nginx
    icon: "\U0001F5A5\uFE0F"  # 🖥️
    role: React SPA + reverse proxy
    tech: [React 18, TypeScript, Vite, Nginx, Tailwind CSS, shadcn/ui, TanStack Query, Wouter, JointJS]
    codeRoot: ui/
    shares_codebase_with: []
    position: { x: 700, y: 190, w: 190, h: 60 }

  rag:
    type: APP
    name: RAG
    icon: "\U0001F4C4"  # 📄
    role: Document & vector search
    tech: [Flask, Celery, Qdrant, MongoDB, sentence-transformers, Docling]
    codeRoot: rag/
    shares_codebase_with: [celery]
    position: { x: 180, y: 380, w: 190, h: 60 }

  mas:
    type: APP
    name: Multi Agent System (MAS)
    icon: "\U0001F916"  # 🤖
    role: Multi-agent orchestration
    tech: [Flask, LangGraph, Temporal, MongoDB, Redis, claude-agent-sdk, deepagents]
    codeRoot: multi-agent/
    shares_codebase_with: [temporal_worker]
    position: { x: 600, y: 380, w: 190, h: 60 }

  identity:
    type: APP
    name: Identity
    icon: "\U0001F510"  # 🔐
    role: Auth & session service
    tech: [Flask, Keycloak, Redis, MongoDB, LDAP]
    codeRoot: shared-resources/identity/
    shares_codebase_with: []
    position: { x: 1020, y: 380, w: 190, h: 60 }

  platform:
    type: APP
    name: Platform Backend
    icon: "\u2699\uFE0F"  # ⚙️
    role: Admin configuration service
    tech: [Flask, MongoDB]
    codeRoot: backend/
    shares_codebase_with: []
    position: { x: 1400, y: 380, w: 230, h: 60 }

  # --- Layer 2: Workers ---
  celery:
    type: WORKER
    name: RAG Celery Workers
    icon: "\u26A1"  # ⚡
    role: Async ingestion pipelines
    tech: [Celery, RabbitMQ]
    codeRoot: rag/  # same codebase as RAG
    shares_codebase_with: [rag]
    position: { x: -200, y: 570, w: 210, h: 60 }

  temporal_worker:
    type: WORKER
    name: MAS Temporal Worker
    icon: "\U0001F504"  # 🔄
    role: Distributed graph execution
    tech: [Temporal SDK, Python]
    codeRoot: multi-agent/  # same codebase as MAS
    shares_codebase_with: [mas]
    position: { x: 820, y: 540, w: 220, h: 60 }

  # --- Layer 3: Infrastructure ---
  mongodb:
    type: INFRA
    name: MongoDB
    icon: "\U0001F343"  # 🍃
    role: Document database
    position: { x: 530, y: 780, w: 190, h: 54 }

  qdrant:
    type: INFRA
    name: Qdrant
    icon: "\U0001F50D"  # 🔍
    role: Vector database
    position: { x: -100, y: 780, w: 190, h: 54 }

  rabbitmq:
    type: INFRA
    name: RabbitMQ
    icon: "\U0001F430"  # 🐰
    role: Celery message broker
    position: { x: 140, y: 780, w: 190, h: 54 }

  redis:
    type: INFRA
    name: Redis
    icon: "\U0001F7E5"  # 🟥
    role: Streaming, sessions & collaboration
    position: { x: 780, y: 780, w: 200, h: 54 }

  temporal:
    type: INFRA
    name: Temporal Server
    icon: "\u23F1\uFE0F"  # ⏱️
    role: Workflow orchestration
    position: { x: 940, y: 710, w: 200, h: 54 }

  # --- External / optional ---
  keycloak:
    type: EXTERNAL
    name: Keycloak
    icon: "\U0001F3F0"  # 🏰
    role: Identity provider (OIDC)
    position: { x: 1020, y: 190, w: 210, h: 54 }

  slack:
    type: DISABLED
    name: Slack API
    icon: "\U0001F4AC"  # 💬
    role: Paused (AIA process)
    position: { x: 10, y: 200, w: 200, h: 54 }

  # --- Shared library ---
  global_utils:
    type: SHARED
    name: global_utils
    icon: "\U0001F4E6"  # 📦
    role: Shared lib (all backends)
    tech: [Pydantic, Redis, httpx, Celery]
    codeRoot: global_utils/src/global_utils/
    shares_codebase_with: []
    position: { x: 600, y: 920, w: 230, h: 54 }


# --- Runtime Dependencies ---
# Each edge represents an actual runtime call or connection.
# protocol: HTTP | gRPC | AMQP | TCP | proxy | webhook
# style: normal (default) | dashed (paused/optional) | codebase (shared code)

edges:
  # Browser → UI
  - from: browser
    to: ui
    label: HTTP
    protocol: HTTP

  # UI → Backend Services (via Nginx proxy)
  - from: ui
    to: rag
    label: /api1
    protocol: proxy
    detail: "Nginx reverse proxy, strips /api1 prefix"

  - from: ui
    to: mas
    label: /api2
    protocol: proxy
    detail: "Nginx reverse proxy. Streaming endpoints: 600s timeout, proxy_buffering off"

  - from: ui
    to: identity
    label: /api3
    protocol: proxy
    detail: "307 redirect to IDENTITY_HOST"

  - from: ui
    to: platform
    label: /api4
    protocol: proxy

  # Identity → Infrastructure
  - from: identity
    to: keycloak
    label: OIDC
    protocol: HTTP
    detail: "OAuth2/PKCE authorization code flow via Authlib"

  - from: identity
    to: redis
    label: sessions
    protocol: TCP
    detail: "Session hash storage via RedisKVStore. Keys: identity:{session_id}, identity:groups:{user_id}"

  - from: identity
    to: mongodb
    label: teams
    protocol: TCP
    detail: "users.teams collection"

  # MAS → Services
  - from: mas
    to: identity
    label: team auth
    protocol: HTTP
    detail: "IdentityPodProvider calls /identity/resolve, /identity/is_member"

  - from: mas
    to: mongodb
    label: sessions
    protocol: TCP
    detail: "7 collections: blueprints, workflow_sessions, resources, shares, templates, credentials, server_configs"

  - from: mas
    to: redis
    label: streams
    protocol: TCP
    detail: "Redis Streams for session events + collaboration presence/edit locks. Keys: mas:collab:*, mas:stream:*"

  - from: mas
    to: temporal
    label: submit WF
    protocol: gRPC
    detail: "TemporalSessionEngine submits SessionWorkflow to task queue 'graph-engine'"

  - from: mas
    to: rag
    label: query.match
    protocol: HTTP
    detail: "RagClient calls RAG /api/vector/query.match for retriever context augmentation"

  - from: mas
    to: temporal_worker
    label: shared codebase
    style: codebase
    detail: "Both run lib/mas/ code. Worker is a separate process."

  # Temporal Worker
  - from: temporal_worker
    to: temporal
    label: poll queue
    protocol: gRPC
    detail: "Polls task queue 'graph-engine' for workflow tasks"

  - from: temporal_worker
    to: redis
    label: stream events
    protocol: TCP
    detail: "Writes node execution events to Redis Streams"

  - from: temporal_worker
    to: mongodb
    label: session state
    protocol: TCP
    detail: "Session lifecycle transitions, node state persistence"

  # Slack (paused)
  - from: slack
    to: rag
    label: paused
    style: dashed
    protocol: webhook
    detail: "Slack Events API webhook (disabled pending AIA approval)"

  # RAG → Infrastructure
  - from: rag
    to: rabbitmq
    label: enqueue
    protocol: AMQP
    detail: "Dispatches pipeline tasks to document_queue / slack_queue"

  - from: rag
    to: mongodb
    label: metadata
    protocol: TCP
    detail: "3 databases: pipeline_monitoring (4 collections), data_sources (2), users (1)"

  - from: rag
    to: qdrant
    label: vectors
    protocol: HTTP
    detail: "Collections: document_data, slack_data"

  # Celery Workers
  - from: celery
    to: rabbitmq
    label: consume
    protocol: AMQP
    detail: "Consumes from document_queue, slack_queue, slack_events_queue"

  - from: celery
    to: mongodb
    label: status
    protocol: TCP
    detail: "Pipeline status updates and monitoring metrics"

  - from: celery
    to: qdrant
    label: upsert
    protocol: HTTP
    detail: "Vector upsert after embedding generation"

  # Platform
  - from: platform
    to: mongodb
    label: config
    protocol: TCP
    detail: "config.admin_config collection"


